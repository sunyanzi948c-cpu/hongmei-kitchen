<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>虹美廚坊 - 線上點餐</title>
    <style>
      /* --- 原有排版與菜單設計 --- */
      body {
        font-family: "微軟正黑體", "Noto Sans TC", sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #fdfaf4;
        color: #333;
      }
      header {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
      }
      header h1 {
        color: #d83b3b;
        margin-bottom: 5px;
      }
      header p {
        color: #666;
        font-size: 0.9em;
      }
      .category-section {
        margin-bottom: 40px;
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
      }
      .category-title {
        border-bottom: 3px solid #ffcc00;
        display: inline-block;
        padding-bottom: 8px;
        margin-bottom: 20px;
        font-size: 1.4em;
      }
      .item-group {
        display: flex;
        overflow-x: auto;
        gap: 20px;
        padding-bottom: 15px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }
      .item-group::-webkit-scrollbar {
        height: 8px;
      }
      .item-group::-webkit-scrollbar-track {
        background: #eee;
        border-radius: 4px;
      }
      .item-group::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }
      .item-group::-webkit-scrollbar-thumb:hover {
        background: #aaa;
      }
      .item {
        flex: 0 0 auto;
        width: 260px;
        background: white;
        border: 1px solid #ebebeb;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        scroll-snap-align: start;
      }
      .item-name {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .item-meta {
        font-size: 0.85em;
        color: #888;
        margin-bottom: 15px;
        background-color: #f4f4f4;
        display: inline-block;
        padding: 3px 8px;
        border-radius: 4px;
      }
      .item-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
      }
      .item-price {
        font-size: 1.3em;
        color: #d83b3b;
        font-weight: bold;
      }
      .add-btn {
        background-color: #ffcc00;
        color: #333;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        transition:
          background 0.2s,
          transform 0.1s;
      }
      .add-btn:hover {
        background-color: #e6b800;
        transform: scale(1.05);
      }
      @media (max-width: 600px) {
        .item {
          width: 75vw;
        }
      }

      /* --- 登入區塊樣式 --- */
      .auth-container {
        max-width: 1000px;
        margin: 0 auto 20px auto;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }
      .user-info {
        font-weight: bold;
        color: #2e7d32;
        display: none;
      }
      .auth-btn {
        padding: 8px 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
        background-color: white;
        cursor: pointer;
        font-weight: bold;
      }
      .auth-btn.login {
        border-color: #4285f4;
        color: #4285f4;
      }
      .auth-btn.login:hover {
        background-color: #f4f8ff;
      }
      .auth-btn.logout {
        display: none;
      }

      /* --- 新增：購物車浮動按鈕與視窗樣式 --- */
      .cart-float-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: #d83b3b;
        color: white;
        padding: 15px 25px;
        border-radius: 30px;
        font-size: 1.1em;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cart-badge {
        background-color: #ffcc00;
        color: #333;
        border-radius: 50%;
        padding: 2px 8px;
        font-size: 0.9em;
      }

      /* 視窗背景遮罩 */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1001;
        justify-content: center;
        align-items: center;
      }
      /* 視窗本體 */
      .modal-content {
        background: white;
        width: 90%;
        max-width: 500px;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        max-height: 80vh;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }
      .close-btn {
        font-size: 1.5em;
        cursor: pointer;
        color: #888;
      }
      .close-btn:hover {
        color: #333;
      }

      /* 購物車明細列表 */
      .cart-items-container {
        overflow-y: auto;
        flex-grow: 1;
        margin-bottom: 15px;
      }
      .cart-item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px dashed #eee;
      }
      .cart-item-info {
        flex-grow: 1;
      }
      .cart-item-name {
        font-weight: bold;
      }
      .cart-item-price {
        color: #888;
        font-size: 0.9em;
      }
      .cart-item-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .qty-btn {
        background: #eee;
        border: none;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        cursor: pointer;
        font-weight: bold;
      }
      /* 新增：清空購物車按鈕樣式 */
      .clear-btn {
        background: none;
        border: 1px solid #ccc;
        color: #666;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.2s;
      }
      .clear-btn:hover {
        background: #ffeeee;
        border-color: #d83b3b;
        color: #d83b3b;
      }
      /* 結帳區 */
      .cart-footer {
        text-align: right;
        border-top: 2px solid #eee;
        padding-top: 15px;
      }
      .cart-total {
        font-size: 1.3em;
        font-weight: bold;
        color: #d83b3b;
        margin-bottom: 15px;
      }
      .checkout-btn {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 1.1em;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
      }
      .checkout-btn:hover {
        background-color: #45a049;
      }

      /* --- 結帳輸入框樣式 --- */
      .checkout-form {
        margin-bottom: 15px;
        text-align: left;
      }
      .checkout-form label {
        display: block;
        font-size: 0.9em;
        color: #666;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .checkout-form input {
        width: calc(100% - 20px);
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <!-- 登入區塊 -->
    <div class="auth-container">
      <span id="user-info" class="user-info"></span>
      <button id="login-btn" class="auth-btn login">Google 帳號登入</button>
      <button id="logout-btn" class="auth-btn logout">登出</button>
    </div>

    <header>
      <h1>虹美廚坊 線上點餐</h1>
      <p>讓食物成為您的藥，不要讓藥成為您的食物。</p>
      <p
        id="discount-info"
        style="color: #2e7d32; font-weight: bold; font-size: 0.9em"></p>
    </header>

    <main id="menu-container"></main>

    <!-- 新增：右下角浮動購物車按鈕 -->
    <div id="cart-float-btn" class="cart-float-btn">
      🛒 購物車 <span id="cart-count" class="cart-badge">0</span>
    </div>

    <!-- 新增：購物車明細視窗 -->
    <div id="cart-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 style="margin: 0">訂單明細</h2>
          <span class="close-btn" id="close-modal-btn">&times;</span>
        </div>
        <div id="cart-items-container" class="cart-items-container">
          <!-- 購物車內容會動態產生在這裡 -->
        </div>
        <div class="cart-footer">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 15px;
            ">
            <button id="clear-cart-btn" class="clear-btn">🗑️ 清空購物車</button>
            <div class="cart-total" style="margin-bottom: 0">
              總計: $<span id="cart-total-price">0</span>
            </div>
          </div>

          <!-- 新增：實名制輸入表單 -->
          <div class="checkout-form">
            <label for="buyer-name">真實姓名：</label>
            <input
              type="text"
              id="buyer-name"
              placeholder="請輸入取餐人姓名"
              required />

            <label for="buyer-phone">聯絡電話：</label>
            <input
              type="tel"
              id="buyer-phone"
              placeholder="請輸入手機號碼"
              required />
          </div>

          <label for="order-notes">備註 (限30字內)：</label>
          <input
            type="text"
            id="order-notes"
            placeholder="例如：少飯"
            maxlength="30" />

          <button id="checkout-btn" class="checkout-btn">送出訂單</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        signInWithPopup,
        GoogleAuthProvider,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      // !!! 請貼上您剛剛測試成功的 Firebase 金鑰 !!!
      const firebaseConfig = {
        apiKey: "AIzaSyDdE3B1QPHTpcpn5i2B54jLBFIKpdrEb8g",
        authDomain: "hongmei-kitchen.firebaseapp.com",
        projectId: "hongmei-kitchen",
        storageBucket: "hongmei-kitchen.firebasestorage.app",
        messagingSenderId: "699922108037",
        appId: "1:699922108037:web:332b78249cc60eb316e3ec",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      let currentUser = null;

      const loginBtn = document.getElementById("login-btn");
      const logoutBtn = document.getElementById("logout-btn");
      const userInfo = document.getElementById("user-info");

      loginBtn.addEventListener("click", () => signInWithPopup(auth, provider));
      logoutBtn.addEventListener("click", () => signOut(auth));

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          userInfo.textContent = `哈囉，${user.displayName}`;
          userInfo.style.display = "inline";
          logoutBtn.style.display = "inline-block";
          loginBtn.style.display = "none";
        } else {
          currentUser = null;
          userInfo.style.display = "none";
          logoutBtn.style.display = "none";
          loginBtn.style.display = "inline-block";
        }
      });

      // ==========================================
      // 新增：購物車邏輯 (LocalStorage)
      // ==========================================

      // 1. 從 LocalStorage 讀取歷史資料，如果沒有就給空陣列
      let cart = JSON.parse(localStorage.getItem("hongmei_cart")) || [];

      // 取得 UI 元素
      const cartFloatBtn = document.getElementById("cart-float-btn");
      const cartModal = document.getElementById("cart-modal");
      const closeModalBtn = document.getElementById("close-modal-btn");
      const cartItemsContainer = document.getElementById(
        "cart-items-container",
      );
      const cartCountEl = document.getElementById("cart-count");
      const cartTotalPriceEl = document.getElementById("cart-total-price");
      const checkoutBtn = document.getElementById("checkout-btn");
      const clearCartBtn = document.getElementById("clear-cart-btn");

      // 開關購物車視窗
      cartFloatBtn.addEventListener("click", () => {
        renderCartUI();
        cartModal.style.display = "flex";
      });
      closeModalBtn.addEventListener(
        "click",
        () => (cartModal.style.display = "none"),
      );

      //  新增：清空購物車的點擊事件
      clearCartBtn.addEventListener("click", () => {
        if (cart.length === 0) {
          alert("購物車已經是空的囉！");
          return;
        }

        // 加入防呆確認視窗
        if (confirm("確定要清空所有已選購的餐點嗎？")) {
          cart = []; // 清空資料陣列
          updateCart(); // 更新右下角浮動按鈕數字與 LocalStorage
          renderCartUI(); // 重新渲染視窗內的明細畫面
        }
      });

      // 點擊遮罩處關閉視窗
      cartModal.addEventListener("click", (e) => {
        if (e.target === cartModal) cartModal.style.display = "none";
      });

      // 2. 更新購物車 UI 與儲存資料的核心函數
      function updateCart() {
        // 將陣列轉為文字存入瀏覽器
        localStorage.setItem("hongmei_cart", JSON.stringify(cart));
        // 更新右下角數字
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        cartCountEl.textContent = totalQty;
      }

      // 3. 渲染視窗內的明細列表
      function renderCartUI() {
        cartItemsContainer.innerHTML = ""; // 清空現有內容
        let totalPrice = 0;

        if (cart.length === 0) {
          cartItemsContainer.innerHTML =
            '<p style="text-align:center; color:#888;">購物車目前是空的喔！</p>';
        } else {
          cart.forEach((item, index) => {
            totalPrice += item.price * item.qty;
            const row = document.createElement("div");
            row.className = "cart-item-row";
            row.innerHTML = `
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price} / 份</div>
                        </div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="window.changeQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="window.changeQty(${index}, 1)">+</button>
                        </div>
                    `;
            cartItemsContainer.appendChild(row);
          });
        }
        cartTotalPriceEl.textContent = totalPrice;
      }

      // 4. 增減數量的函數 (掛載到 window 以便 onclick 呼叫)
      window.changeQty = function (index, delta) {
        cart[index].qty += delta;
        // 如果數量降到 0，就從陣列中移除該項目
        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }
        updateCart();
        renderCartUI(); // 重新渲染畫面
      };

      // 5. 將餐點加入購物車
      function addToCart(name, price) {
        if (!currentUser) {
          alert(
            "為了保障您的訂單權益並防範惡意下單，本系統採實名認證。請先使用上方 Google 帳號登入進行驗證，謝謝您的配合！",
          );
          return;
        }
        // 檢查購物車內是否已經有這項餐點
        const existingItem = cart.find((item) => item.name === name);
        if (existingItem) {
          existingItem.qty += 1;
        } else {
          // 沒有的話就加入新的一筆
          cart.push({ name: name, price: price, qty: 1 });
        }
        updateCart();

        // 顯示一個小提示
        const btn = document.getElementById("cart-float-btn");
        btn.style.transform = "scale(1.1)";
        setTimeout(() => (btn.style.transform = "scale(1)"), 200);
      }

      // 初始化執行一次更新，讓重新整理後按鈕上依然顯示正確數字
      updateCart();

      // ==========================================
      // 菜單渲染邏輯
      // ==========================================
      const menuData = {
        restaurantInfo: { discount: "優惠：凡自帶餐盒、杯子折5元" },
        menu: [
          {
            category: "午/晚餐系列",
            items: [
              { name: "鮭魚", calories: 598, price: 190 },
              { name: "歐美佳嚴選鯖魚(招牌菜)", calories: 725, price: 160 },
              { name: "紅燒秋刀魚", calories: 632, price: 130 },
              { name: "香烤虱目魚肚", calories: 747, price: 150 },
              { name: "三杯雞", calories: 608, price: 130 },
              { name: "蔥燒雞腿", calories: 652, price: 130 },
              { name: "大烤雞腿", calories: 713, price: 150 },
              { name: "日式燒肉", calories: 670, price: 130 },
              { name: "烤鮭魚下巴", calories: 561, price: 150 },
              { name: "蔬菜", calories: 437, price: 90 },
              { name: "幸福餐盒(日式燒肉)", calories: 423, price: 90 },
              { name: "幸福餐盒(三杯雞)", calories: 431, price: 90 },
              { name: "幸福餐盒(秋刀魚)", calories: 395, price: 90 },
            ],
          },
          {
            category: "單點系列",
            items: [
              { name: "鮭魚", price: 140 },
              { name: "鯖魚", price: 110 },
              { name: "秋刀魚", price: 90 },
              { name: "虱目魚肚", price: 105 },
              { name: "烤鮭魚下巴", price: 105 },
              { name: "燒肉", price: 90 },
              { name: "滷雞腿", price: 95 },
              { name: "三杯雞", price: 90 },
              { name: "大烤雞腿", price: 115 },
            ],
          },
          {
            category: "豆漿 | 綠拿鐵 | 湯品",
            items: [
              { name: "有糖(赤藻糖)原味豆漿", calories: 102, price: 40 },
              { name: "無糖原味豆漿", calories: 102, price: 35 },
              { name: "綠拿鐵", calories: 286, price: 99 },
              { name: "白木耳", calories: 76, price: 50 },
            ],
          },
          {
            category: "饅頭系列",
            items: [
              { name: "芋頭饅頭", calories: 215, price: 35 },
              { name: "南瓜饅頭", calories: 279, price: 35 },
              { name: "桂圓紅棗饅頭", calories: 186, price: 35 },
              { name: "紅藜堅果饅頭", calories: 297, price: 35 },
            ],
          },
        ],
      };

      document.getElementById("discount-info").textContent =
        menuData.restaurantInfo.discount;
      const container = document.getElementById("menu-container");

      menuData.menu.forEach((categoryData) => {
        const section = document.createElement("div");
        section.className = "category-section";

        const title = document.createElement("h2");
        title.className = "category-title";
        title.textContent = categoryData.category;
        section.appendChild(title);

        const itemGroup = document.createElement("div");
        itemGroup.className = "item-group";

        categoryData.items.forEach((item) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          const caloriesHtml = item.calories
            ? `<div class="item-meta">${item.calories} 卡</div>`
            : "";

          itemDiv.innerHTML = `
                    <div>
                        <div class="item-name">${item.name}</div>
                        ${caloriesHtml}
                    </div>
                    <div class="item-bottom">
                        <div class="item-price">$${item.price}</div>
                    </div>
                `;

          const addBtn = document.createElement("button");
          addBtn.className = "add-btn";
          addBtn.textContent = "＋";
          // ★ 修改點：將原本的 alert 改成呼叫加入購物車函數 ★
          addBtn.addEventListener("click", () => {
            addToCart(item.name, item.price);
          });

          itemDiv.querySelector(".item-bottom").appendChild(addBtn);
          itemGroup.appendChild(itemDiv);
        });
        section.appendChild(itemGroup);
        container.appendChild(section);
      });

      // ==========================================
      // 結帳與發送資料到 Google 試算表 (GAS)
      // ==========================================
      checkoutBtn.addEventListener("click", async () => {
        if (cart.length === 0) {
          alert("購物車是空的喔！");
          return;
        }
        if (!currentUser) {
          alert("請先使用上方 Google 帳號登入！");
          return;
        }

        const buyerName = document.getElementById("buyer-name").value.trim();
        const buyerPhone = document.getElementById("buyer-phone").value.trim();
        const orderNotes = document.getElementById("order-notes").value.trim();

        if (!buyerName || !buyerPhone) {
          alert("請填寫完整的真實姓名與聯絡電話！");
          return;
        }

        // 防呆：將按鈕鎖定並改變文字，避免重複點擊
        checkoutBtn.disabled = true;
        checkoutBtn.textContent = "訂單傳送中...";
        checkoutBtn.style.backgroundColor = "#ccc";

        // 2. 將備註 (notes) 加入要傳送的資料包中
        const orderData = {
          email: currentUser.email,
          googleName: currentUser.displayName,
          realName: buyerName,
          phone: buyerPhone,
          notes: orderNotes, // <--- 新增這行
          cart: cart,
          total: cart.reduce((sum, item) => sum + item.price * item.qty, 0),
        };

        // ★★★ 請在部署完 GAS 後，將網址貼到這裡 ★★★
        const gasAPI =
          "https://script.google.com/macros/s/AKfycbzhUqEZGSdDpVQfFFCPRe1Ze3OjVjoQL_OllH6npQuw_5ePqJQSoNvLnx9wC_mCdtdP/exec";

        try {
          // 將資料以 POST 方式送到 GAS
          const response = await fetch(gasAPI, {
            method: "POST",
            // 注意：如果是 text/plain 可以避開 CORS 跨網域存取限制，GAS 後端照樣能用 JSON.parse 解析
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(orderData),
          });

          const result = await response.json();

          if (result.status === "success") {
            alert("🎉 訂單送出成功！感謝您的訂購。");
            // 清空購物車
            cart = [];
            updateCart();
            renderCartUI();
            cartModal.style.display = "none";
            // 清空輸入框
            document.getElementById("buyer-name").value = "";
            document.getElementById("buyer-phone").value = "";
            document.getElementById("order-notes").value = "";
          } else {
            alert("訂單送出失敗，請稍後再試。錯誤訊息：" + result.message);
          }
        } catch (error) {
          console.error("API 呼叫錯誤:", error);
          alert("網路連線異常，請確認網路狀態後重試！");
        } finally {
          // 恢復按鈕狀態
          checkoutBtn.disabled = false;
          checkoutBtn.textContent = "送出訂單";
          checkoutBtn.style.backgroundColor = "#4caf50";
        }
      });
    </script>
  </body>
</html>
